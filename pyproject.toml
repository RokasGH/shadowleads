[project]
name = "shadowleads"
version = "0.1.0"
description = "Surfaces shadow-economy leads among Vilnius businesses: busy on Google, quiet on paper."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cyclopts>=3.1",
    "duckdb>=1.2",
    "httpx>=0.28",
    "pandas>=3.0.6",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pydeck>=0.9.3",
    "rapidfuzz>=3.10",
    "selectolax>=0.3.27",
    "streamlit>=1.41",
    "structlog>=24.4",
    "tenacity>=9.0",
]

[project.scripts]
shadowleads = "shadowleads.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.120",
    "pyrefly>=0.40",
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shadowleads"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PTH"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]  # Lithuanian unicode; line length is left to the formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyrefly]
project-includes = ["src", "tests", "app"]
search-path = ["src", "app"]
